name: Nightly backup
# Exports everything users create (accounts, notes, questions, votes, groups, chavrusa posts) from D1 and stores it in R2 as backups/d1-<date>.sql.
# The texts themselves are not in D1 (they live in R2 and are re-creatable from Sefaria's export).
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Export user data from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            export CLOUDFLARE_ACCOUNT_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | python3 -c "import json,sys;print(json.load(sys.stdin)['result'][0]['id'])")
          fi
          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" >> "$GITHUB_ENV"
          npm install --no-save wrangler@4
          npx wrangler d1 export torah-world --remote --output backup.sql \
            --table users --table notes --table note_links --table votes --table dupflags \
            --table groups --table memberships --table chavrusa --table responses
          ls -l backup.sql
      - name: Store in R2 (backups/d1-<date>.sql)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import datetime, os, sys, time, urllib.request
          sys.path.insert(0, 'scripts')
          from upload_r2 import call, API
          key = 'backups/d1-' + datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d') + '.sql'
          data = open('backup.sql', 'rb').read()
          call('PUT', f"{API}/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/r2/buckets/torah-world-data/objects/{key}", data, 'application/sql')
          print('stored', key, len(data), 'bytes')
          PY
