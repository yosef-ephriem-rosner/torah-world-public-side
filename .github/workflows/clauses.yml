name: Build clauses
# Splits base segments into clauses and assigns commentary to clauses (docs/CLAUSES_CONTRACT.md). Writes clauses/, clausepacks/, reports/clauses/ to R2.
on:
  workflow_dispatch:
    inputs:
      group:
        description: 'JSON array of catalog categories (matrix), e.g. ["Tanakh","Mishnah"]'
        required: true
        default: '["Tanakh","Mishnah"]'
        type: string
permissions:
  contents: read
jobs:
  clauses:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        group: ${{ fromJson(inputs.group) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build and upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            export CLOUDFLARE_ACCOUNT_ID=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" https://api.cloudflare.com/client/v4/accounts | python3 -c "import json,sys;print(json.load(sys.stdin)['result'][0]['id'])")
          fi
          python3 scripts/clauses/build.py --group "${{ matrix.group }}" --out out --cache cache
